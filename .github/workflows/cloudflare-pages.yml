name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      debug:
        description: 'Enable debug logging'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  CACHE_KEY_PREFIX: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      build-success: ${{ steps.build.outcome }}
      cache-hit: ${{ steps.cache-deps.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ env.CACHE_KEY_PREFIX }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-npm-
            npm-

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            dist
            .cache
          key: ${{ env.CACHE_KEY_PREFIX }}-build-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-build-

      - name: Install dependencies
        id: install
        run: |
          echo "::group::Installing npm dependencies"
          npm ci --prefer-offline --no-audit --no-fund
          echo "::endgroup::"
        timeout-minutes: 5
        continue-on-error: false

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm run test

      # DB audit skipped in CI: Supabase returns 522 from GitHub runners (network unreachable).
      # Run locally: npm run test:db-audit
      - name: Run database audit
        continue-on-error: true
        run: |
          echo "Skipping db audit in CI (Supabase unreachable from GitHub runners). Run 'npm run test:db-audit' locally."

      - name: Run lint
        run: npm run lint

      - name: Validate Supabase config (production build)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase public URL and anon key are required for a production build."
            exit 1
          fi
          if ! echo "$VITE_SUPABASE_ANON_KEY" | grep -q '^eyJ'; then
            echo "::error::VITE_SUPABASE_ANON_KEY must be the JWT anon key (starts with eyJ), not a publishable key."
            exit 1
          fi
          echo "✓ Supabase public configuration is present"

      - name: Build application
        id: build
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_PLACE_ID: ${{ secrets.VITE_GOOGLE_PLACE_ID }}
          VITE_ADMIN_ALLOWLIST_EMAILS: ${{ secrets.VITE_ADMIN_ALLOWLIST_EMAILS }}
          VITE_BREAK_GLASS_ADMIN_EMAIL: ${{ secrets.VITE_BREAK_GLASS_ADMIN_EMAIL }}
          VITE_ADMIN_OAUTH_REDIRECT_URL: ${{ secrets.VITE_ADMIN_OAUTH_REDIRECT_URL }}
          DEBUG: ${{ github.event.inputs.debug && '*' || '' }}
        run: |
          echo "::group::Building application"
          npm run build 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo "::endgroup::"
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code $BUILD_EXIT_CODE"
            cat build.log | tail -50
            exit 1
          fi
          
          echo "✅ Build completed successfully"
          echo "Build output size: $(du -sh dist | cut -f1)"

      - name: Install browser for pre-deployment checks
        run: npx playwright install chromium --with-deps

      - name: Run public journeys against the release build
        env:
          CI: true
        run: npx playwright test e2e/smoke.spec.ts e2e/store.spec.ts e2e/join-now.spec.ts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist
          retention-days: 1
          if-no-files-found: error

      - name: Report build status
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "✅ Build job completed successfully"
          else
            echo "❌ Build job failed"
          fi

  # Uses GitHub environment "production". If that env has Required reviewers, this job will wait for approval (see DEBUG_DEPLOY.md).
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    # A pull request must never publish to the live main branch.
    if: github.event_name != 'pull_request'
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Require Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it in Settings → Secrets and variables → Actions (repository secrets). Token needs Account + Cloudflare Pages Edit."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. Add it in Settings → Secrets and variables → Actions (repository secrets)."
            exit 1
          fi
          echo "Cloudflare secrets are set."

      # Debug: print why deploy might not reach Cloudflare (no secret values logged)
      - name: Deploy diagnostics
        env:
          CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'set' || 'NOT SET' }}
          CF_ACCOUNT_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && 'set' || 'NOT SET' }}
        run: |
          echo "::group::Deploy diagnostics"
          echo "event: ${{ github.event_name }} | ref: ${{ github.ref }} | sha: ${{ github.sha }}"
          echo "CLOUDFLARE_API_TOKEN: $CF_TOKEN_SET"
          echo "CLOUDFLARE_ACCOUNT_ID: $CF_ACCOUNT_SET"
          echo "command: pages deploy dist --project-name=lords-gym (includes functions/)"
          echo "If deploy job shows 'Waiting for approval', go to Settings → Environments → production and Approve or disable Required reviewers."
          echo "::endgroup::"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lords-gym --branch=${{ github.event.inputs.environment == 'staging' && 'staging' || 'main' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployment (health check)
        id: health-check
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.deployment-url }}"
          DEPLOY_ENV="${{ github.event.inputs.environment || 'production' }}"
          echo "Checking deployment health: $DEPLOY_URL"
          if [ -z "$DEPLOY_URL" ] || [ "$DEPLOY_URL" = "undefined" ]; then
            echo "❌ No deployment URL available"
            exit 1
          fi

          # Preview URLs are intentionally gated by Cloudflare Access. A 302 to
          # the expected Access host proves the deployment is present, not that
          # it is publicly browseable. Never disable Access to make CI green.
          if [ "$DEPLOY_ENV" = "staging" ]; then
            HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$DEPLOY_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Staging preview is reachable"
              exit 0
            fi
            if [ "$HTTP_STATUS" = "302" ] && curl -sSI "$DEPLOY_URL" | grep -iq '^location: https://lords-gym-pages.cloudflareaccess.com/'; then
              echo "✅ Staging preview was deployed and is protected by Cloudflare Access"
              echo "::notice::Authenticated preview browser QA requires a Cloudflare Access session."
              exit 0
            fi
            echo "❌ Unexpected staging response: HTTP $HTTP_STATUS"
            exit 1
          fi

          EXPECTED_BUNDLE=$(node -e "const h=require('fs').readFileSync('dist/index.html','utf8');const m=h.match(/assets\/index-[^\" ]+\.js/);if(!m)process.exit(1);process.stdout.write(m[0])")
          echo "Expecting production bundle: $EXPECTED_BUNDLE"
          
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            LIVE_HTML=$(curl -fsS --max-time 10 https://lordsgymoutreach.com/ || true)
            if printf '%s' "$LIVE_HTML" | grep -Fq "$EXPECTED_BUNDLE"; then
              echo "✅ Production domain serves the expected release bundle"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Attempt $RETRY_COUNT/$MAX_RETRIES: waiting for the release bundle on the production domain..."
            sleep 10
          done
          
          echo "❌ Production domain did not serve the expected release bundle"
          exit 1

  e2e:
    name: E2E Production Tests
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.event.inputs.environment != 'staging'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run E2E smoke tests
        env:
          PLAYWRIGHT_BASE_URL: https://lordsgymoutreach.com
          CI: true
        run: npx playwright test e2e/smoke.spec.ts e2e/store.spec.ts e2e/join-now.spec.ts

  notify:
    name: Post Deployment Notification
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post PR comment with deployment URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const buildStatus = '${{ needs.build.result }}';
            const deployStatus = '${{ needs.deploy.result }}';
            const deployUrl = '${{ needs.deploy.outputs.deployment-url }}';
            
            let statusEmoji = '❌';
            let statusText = 'Failed';
            
            if (buildStatus === 'success' && deployStatus === 'success') {
              statusEmoji = '✅';
              statusText = 'Success';
            } else if (buildStatus === 'success' && deployStatus === 'skipped') {
              statusEmoji = '⚠️';
              statusText = 'Build Only (PR never deploys)';
            } else if (buildStatus === 'cancelled' || deployStatus === 'cancelled') {
              statusEmoji = '🚫';
              statusText = 'Cancelled';
            }
            
            const body = `## ${statusEmoji} Cloudflare Pages Deployment
            
            | Step | Status |
            |------|--------|
            | Build | ${buildStatus === 'success' ? '✅ Success' : buildStatus === 'failure' ? '❌ Failed' : '🚫 Cancelled'} |
            | Deploy | ${deployStatus === 'success' ? '✅ Success' : deployStatus === 'skipped' ? '⏭️ Skipped' : deployStatus === 'failure' ? '❌ Failed' : '🚫 Cancelled'} |
            
            ${deployUrl ? `**🚀 Preview URL:** ${deployUrl}` : ''}
            
            <sub>Workflow run: [View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Cloudflare Pages Deployment')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
              console.log('Updated existing PR comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              console.log('Created new PR comment');
            }

  report:
    name: Deployment Summary
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Output deployment summary
        run: |
          echo "## 📊 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Success' || needs.build.result == 'failure' && '❌ Failed' || '🚫 Cancelled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result == 'success' && '✅ Success' || needs.deploy.result == 'skipped' && '⏭️ Skipped' || needs.deploy.result == 'failure' && '❌ Failed' || '🚫 Cancelled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          DEPLOY_URL="${{ needs.deploy.outputs.deployment-url }}"
          if [ -n "$DEPLOY_URL" ]; then
            echo "**🚀 Deployment URL:** $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
